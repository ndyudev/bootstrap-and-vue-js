<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Thành Phần Dinh Dưỡng</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Kit -->
    <script src="https://kit.fontawesome.com/f4e3fc99b3.js" crossorigin="anonymous"></script>
</head>

<body class="bg-light">
    <div class="container py-4">
        <div class="card mx-auto w-100" style="max-width:760px;">
            <div class="card-body">
                <h5 class="card-title text-center text-danger fw-bold mb-3">Bảng Thành Phần Dinh Dưỡng</h5>

                <div class="table-responsive">
                    <table class="table table-bordered table-sm align-middle">
                        <thead>
                            <tr class="table-warning text-center">
                                <th rowspan="2" class="align-middle" style="width:40%;">Thành Phần</th>
                                <th colspan="2" class="align-middle">Giá Trị</th>
                            </tr>
                            <tr class="table-warning text-center">
                                <th class="align-middle" style="width:30%;">Khối Lượng</th>
                                <th class="align-middle" style="width:30%;">% DV*</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Calories</td>
                                <td class="text-center">200 kcal</td>
                                <td class="text-center">20%</td>
                            </tr>
                            <tr>
                                <td>Chất Béo</td>
                                <td class="text-center">9 g</td>
                                <td class="text-center">14%</td>
                            </tr>
                            <tr>
                                <td>Chất Béo Bão Hòa</td>
                                <td class="text-center">4 g</td>
                                <td class="text-center">20%</td>
                            </tr>
                            <tr>
                                <td>Chất Đạm</td>
                                <td class="text-center">8 g</td>
                                <td class="text-center">16%</td>
                            </tr>
                            <tr>
                                <td>Chất Xơ</td>
                                <td class="text-center">5 g</td>
                                <td class="text-center">20%</td>
                            </tr>
                            <tr>
                                <td>Đường</td>
                                <td class="text-center">12 g</td>
                                <td class="text-center">-</td>
                            </tr>
                            <tr>
                                <td rowspan="2">Vitamin</td>
                                <td>Vitamin C</td>
                                <td class="text-center">25%</td>
                            </tr>
                            <tr>
                                <td>Vitamin D</td>
                                <td class="text-center">10%</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <p class="text-muted small mb-0 mt-2">* % Giá trị dinh dưỡng hàng ngày (DV)</p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
