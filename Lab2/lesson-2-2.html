<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 2 Lab 2 | Bootstrap 5 | PS44284 - Chau Nhat Du</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/f4e3fc99b3.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="container border border-black mt-4">
        <div class="row">
            <div class="col-sm-6 py-3">
                <h4 class="text-black mb-3">Form Đăng Ký Thông Tin</h4>
                <form class="border-black border p-3 rounded was-validated">

                    <div class="mb-3">
                        <label for="fullname" class="form-label">Họ và tên</label>
                        <input type="text" class="form-control" id="fullname" placeholder="Nhập họ và tên" required>
                        <div class="valid-feedback">Hợp lệ</div>
                        <div class="invalid-feedback">Vui lòng nhập</div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Nhập email" required>
                        <div class="valid-feedback">Hợp lệ</div>
                        <div class="invalid-feedback">Vui lòng nhập</div>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Số điện thoại</label>
                        <input type="tel" class="form-control" id="phone" placeholder="Nhập số điện thoại" required>
                        <div class="valid-feedback">Hợp lệ</div>
                        <div class="invalid-feedback">Vui lòng nhập</div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Mật khẩu</label>
                        <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu" required>
                        <div class="valid-feedback">Hợp lệ</div>
                        <div class="invalid-feedback">Vui lòng nhập</div>
                    </div>

                    <div class="mb-3">
                        <label for="confirm-password" class="form-label">Xác nhận mật khẩu</label>
                        <input type="password" class="form-control" id="confirm-password"
                            placeholder="Xác nhận mật khẩu" required>
                        <div class="valid-feedback">Hợp lệ</div>
                        <div class="invalid-feedback">Vui lòng nhập</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Giới tính:</label>
                        <div class="form-check form-check-inline mx-3">
                            <input class="form-check-input" type="radio" name="gender" id="male" checked required>
                            <label class="form-check-label" for="male">Nam</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="female">
                            <label class="form-check-label" for="female">Nữ</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="language" class="form-label">Ngôn ngữ</label>
                        <select name="language" id="language" class="form-select" required>
                            <option value="Vietnamese">Tiếng Việt</option>
                            <option value="English">Tiếng Anh</option>
                            <option value="Chinese">Tiếng Trung</option>
                            <option value="Japanese">Tiếng Nhật</option>
                        </select>
                        <div class="valid-feedback">Hợp lệ</div>
                        <div class="invalid-feedback">Vui lòng nhập</div>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="confirm-terms" required>
                        <label class="form-check-label" for="confirm-terms">
                            Tôi đồng ý với các điều khoản và điều kiện
                        </label>
                    </div>
                    <div class="mb-3">
                        <button type="submit" class="btn btn-primary">Đăng ký</button>
                    </div>
                </form>
            </div>
            <div class="col-sm-6 py-3">
                <h4 class="text-black mb-3">Form Đăng Nhập</h4>
                <form class="border border-black rounded p-4 was-validated">
                    <div class="mb-3">
                        <label for="email-login" class="form-label">Email</label>
                        <input type="text" class="form-control" id="email-login" placeholder="Nhập email" required>
                        <div class="valid-feedback">Hợp lệ</div>
                        <div class="invalid-feedback">Vui lòng nhập</div>
                    </div>
                    <div class="mb-3">
                        <label for="password-login" class="form-label">Mật khẩu</label>
                        <input type="password" class="form-control" id="password-login" placeholder="Nhập mật khẩu"
                            required>
                        <div class="valid-feedback">Hợp lệ</div>
                        <div class="invalid-feedback">Vui lòng nhập</div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-2">Đăng nhập</button>
                </form>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
